[build]
  # Build the landing page from the subfolder, then publish the workspace root.
  command   = "npm --prefix landing-page ci && npm --prefix landing-page run build"
  publish   = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/login/"
  to = "/login.html"
  status = 301

[[redirects]]
  # proxy any /api/payhere/* to the matching Function
  from   = "/api/payhere/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
